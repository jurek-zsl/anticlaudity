name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stub agy)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh
      - name: Python syntax
        run: python3 -m py_compile bin/anticlaudity

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from local checkout into a temp HOME
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh
          test -x "$HOME/.local/bin/anticlaudity"
          test -f "$HOME/.claude/skills/delegate-to-antigravity/SKILL.md"
          ./uninstall.sh
          test ! -e "$HOME/.local/bin/anticlaudity"
